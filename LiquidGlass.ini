@include=#@#Settings.inc

[Variables]
UNIT_TEMP=F
UNIT_WIND=mph
UNIT_PRESS=inHg
UNIT_SENSOR=AQI
SENSOR_MAX=300
Name=Liquid Glass (Home Assistant)
Author=Brodie Grant
Information=Liquid glass homescreen widget for Home Assistant. Requires HomeAssitantPlugin.dll in Documents\Rainmeter\Plugins (github.com/cperryoh/HomeAssitant-Rainmeter)
Version=1.0

; ================= Layout & palette =================
W=380
H=980

C_TEXT=235,240,248
C_MUTED=139,148,158
C_ACCENT=88,166,255
C_SUCCESS=63,185,80
C_WARN=210,153,34
C_DANGER=248,81,73

; ================= Clock =================
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A, %B %d

; ================= Home Assistant: weather =================
[MeasureWxState]
Measure=Plugin
Plugin=#SETTINGSPATH#\Plugins\HomeAssitantPlugin.dll
authKey=#HA_TOKEN#
server=#HA_SERVER#
ssl=#HA_SSL#
port=#HA_PORT#
entityId=#WEATHER_ENTITY#
path=state
UpdateDivider=10

[MeasureWxTemp]
Measure=Plugin
Plugin=#SETTINGSPATH#\Plugins\HomeAssitantPlugin.dll
authKey=#HA_TOKEN#
server=#HA_SERVER#
ssl=#HA_SSL#
port=#HA_PORT#
entityId=#WEATHER_ENTITY#
path=attributes.temperature
isInt=true
UpdateDivider=10

