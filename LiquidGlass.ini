; ================= Meters =================

; Optional true frosted glass: screenshot your desktop, blur it, save as
; wallpaper-blur.png in this @Resources folder and uncomment this meter.
; The image must line up with this skin's screen position.
;[MeterWallpaper]
;Meter=Image
;ImageName=#@#wallpaper-blur.png
;X=0
;Y=0
;W=380
;H=624
;ImageAlpha=150

; --- Glass panel: layered gradients, diagonal sheen, edge glints ---
[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,380,624,26 | Fill Color 22,27,34 | StrokeWidth 1 | Stroke Color 48,54,61
Shape2=Rectangle 1.5,1.5,377,621,25 | Fill Color 255,255,255
Shape5=Rectangle 28,1,324,2,1 | Fill Color 255,255,255
Shape6=Rectangle 28,621,324,2,1 | Fill Color 255,255,255

; --- Fine grain texture for the glass ---
[MeterNoise]
Meter=Image
ImageName=#@#noise.png
X=0
Y=0
W=380
H=624
Tile=1
ImageAlpha=80

; --- Header: HA status dot + location + server ---
[MeterDot]
Meter=Shape
Shape=Ellipse 38,44,4.5 | Fill Color 63,185,80
Shape2=Ellipse 38,44,9 | Fill Color 63,185,80

[MeterTitle]
Meter=String
Text=#LOCATION_LABEL#
X=54
Y=34
FontSize=13
FontWeight=600
FontColor=235,240,248,230
AntiAlias=1

[MeterServer]
Meter=String
Text=#HA_SERVER#
X=350
Y=36
StringAlign=Right
FontSize=11
FontWeight=400
FontColor=139,148,158,200
AntiAlias=1

[MeterClock]
Meter=String
MeasureName=MeasureTime
X=190
Y=62
StringAlign=CenterTop
FontSize=58
FontWeight=300
FontColor=235,240,248
AntiAlias=1
FontEffectColor=0,0,0,120
StringEffect=Shadow

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=190
Y=130
StringAlign=CenterTop
FontSize=13
FontWeight=500
FontColor=139,148,158,230
AntiAlias=1

[MeterDiv1]
Meter=Shape
Shape=Rectangle 30,168,320,1,0 | Fill Color 255,255,255

; ================= Weather Section =================
[MeterWxTemp]
Meter=String
MeasureName=MeasureWxTemp
Text=%1#UNIT_TEMP#
X=190
